<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; connect-src 'self'; base-uri 'none'; form-action 'none'">
    <meta name="referrer" content="no-referrer">
    <title>DeepSeek API Key 设置</title>
    <link rel="stylesheet" href="deepseek-key.css">
    <script src="deepseek-key.js" defer></script>
</head>
<body>
    <main>
        <a href="agent.html">← 返回 Agent 工作台</a>
        <h1>DeepSeek API Key</h1>
        <p>密钥只保存在当前浏览器对应的服务端会话内存中。关闭会话或服务重启后需要重新设置。</p>
        <p id="key-status" role="status">正在读取状态…</p>
        <form id="key-form" autocomplete="off" hidden>
            <label for="api-key">输入新密钥</label>
            <input id="api-key" name="api-key" type="password" autocomplete="new-password" maxlength="512" required disabled>
            <button type="submit">保存或替换</button>
        </form>
        <button id="remove-key" type="button" hidden>移除本会话密钥</button>
        <p class="hint">移除后使用服务器的 DEEPSEEK_API_KEY 环境变量；如果服务器未配置，则需要重新输入。</p>
        <p id="key-result" role="alert"></p>
    </main>
</body>
</html>
